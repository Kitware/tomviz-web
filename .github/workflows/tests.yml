name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nox:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install OSMesa for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev

      - name: Build Vue Components
        run: |
          cd vue-components
          npm ci
          npm run build

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests and code validation
        run: uv run nox
