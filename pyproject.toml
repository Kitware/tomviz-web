[project]
name = "tomviz-trame"
version = "1.0.0"
description = "trame and VTK based web version of tomviz"
authors = [
    {name = "Kitware Inc"},
]
dependencies = [
    "trame>=3.12",
    "trame-vuetify",
    "trame-vtk",
    "trame-dataclass>=2.1.3",
    "trame-dockview>=2",
    "trame-color-opacity-editor",
    "trame-colormaps>=1.5",
    "loguru",
    "vtk>=9.7",
    "tomviz-pipeline>=3.1.6",
    "scipy>=1.17.1",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache Software License"}
keywords = ["Python", "Interactive", "Web", "Application", "Framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
app = [
    "pywebview",
]
dev = [
    "pre-commit",
    "ruff",
    "pytest >=6",
    "pytest-cov >=3",
    "nox",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build]
include = [
  "/src/tomviz_trame/**/*.py",
  "/src/tomviz_trame/app/assets/**/*",
  "/src/tomviz_trame/app/module/serve/**/*",
  "/src/tomviz_trame/builtin_kernels/**/*",
  "/src/tomviz_trame/widgets/module/serve/*.js",
  "/src/tomviz_trame/widgets/module/serve/*.css",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/tomviz_trame",
]

[tool.ruff]

[tool.ruff.lint]
extend-select = [
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "G",   # flake8-logging-format
    "I",   # isort
    "ICN", # flake8-import-conventions
    "NPY", # NumPy specific rules
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "YTT", # flake8-2020
]
ignore = [
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
    "ISC001",  # Conflicts with formatter
    "RUF012", # to be removed
]
isort.required-imports = []

[tool.ruff.lint.per-file-ignores]
"src/tomviz_trame/builtin_kernels/**" = [# upstream tomviz scripts, ported as-is
    "I",
    "T201",
    "RET",
    "RUF",
    "EM",
    "UP",
    "NPY",
    "SIM",
    "ARG",
    "EXE",
    "PTH",
    "B",
    "PT",
    "F821",
    "C416",
    "PD",
    "PGH004",
    "PLR1714",
    "E741",
    "PLW0127",
]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]
"src/**" = ["SIM117"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "src/tomviz_trame/__init__.py:__version__",
]

build_command = "uv build"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
